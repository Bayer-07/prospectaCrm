openapi: 3.0.3
info:
  title: BZS One — API pública reconstruída
  version: 1.0.0
  description: >-
    Subconjunto público confirmado pelo filtro de Swagger da API. Autenticação por
    chave `pk_`, datas ISO-8601 UTC, telefones E.164 e paginação por cursor. [CONFIRMADO]
servers:
  - url: /api/v1
    description: Mesma origem da aplicação [CONFIRMADO]
security:
  - api-key: []
tags:
  - name: Empresas
  - name: Contatos
  - name: Oportunidades
  - name: Tarefas
  - name: Tags
  - name: Campos personalizados
  - name: Segmentos
paths:
  /companies:
    get:
      tags: [Empresas]
      summary: Listar empresas
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/OwnerFilter'
        - $ref: '#/components/parameters/TeamFilter'
        - $ref: '#/components/parameters/SectorFilter'
        - $ref: '#/components/parameters/SizeFilter'
        - $ref: '#/components/parameters/HasContacts'
      responses:
        '200':
          description: Página de empresas [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
    post:
      tags: [Empresas]
      summary: Criar ou fazer upsert de empresa
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Empresa criada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Empresas]
      summary: Consultar empresa
      responses:
        '200':
          description: Empresa visível à chave [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Empresas]
      summary: Atualizar empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatch'
      responses:
        '200':
          description: Empresa atualizada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
    delete:
      tags: [Empresas]
      summary: Desativar empresa
      responses:
        '200':
          description: Empresa arquivada [CONFIRMADO]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyResponse' }
  /contacts:
    get:
      tags: [Contatos]
      summary: Listar contatos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ConsentFilter'
        - $ref: '#/components/parameters/EmailOnly'
        - $ref: '#/components/parameters/OwnerFilter'
        - $ref: '#/components/parameters/TeamFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/CompanyFilter'
        - $ref: '#/components/parameters/HasPhone'
        - $ref: '#/components/parameters/HasEmail'
      responses:
        '200':
          description: Página de contatos [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
    post:
      tags: [Contatos]
      summary: Criar ou fazer upsert de contato
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contato criado [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '409': { $ref: '#/components/responses/Conflict' }
  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Contatos]
      summary: Consultar contato
      responses:
        '200':
          description: Contato visível à chave [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contatos]
      summary: Atualizar contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPatch'
      responses:
        '200':
          description: Contato atualizado [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
    delete:
      tags: [Contatos]
      summary: Desativar contato
      responses:
        '200':
          description: Contato arquivado [CONFIRMADO]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
  /opportunities:
    get:
      tags: [Oportunidades]
      summary: Listar oportunidades
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de oportunidades [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityListResponse'
    post:
      tags: [Oportunidades]
      summary: Criar oportunidade
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityInput'
      responses:
        '201':
          description: Oportunidade criada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
  /opportunities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Oportunidades]
      summary: Consultar oportunidade
      responses:
        '200':
          description: Oportunidade visível à chave [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
    patch:
      tags: [Oportunidades]
      summary: Atualizar oportunidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityPatch'
      responses:
        '200':
          description: Oportunidade atualizada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
    delete:
      tags: [Oportunidades]
      summary: Desativar oportunidade
      responses:
        '200':
          description: Oportunidade arquivada [CONFIRMADO]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityResponse' }
  /tasks:
    get:
      tags: [Tarefas]
      summary: Listar tarefas
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TaskStatus'
      responses:
        '200':
          description: Página de tarefas [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
    post:
      tags: [Tarefas]
      summary: Criar tarefa
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Tarefa criada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Tarefas]
      summary: Atualizar tarefa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: Tarefa atualizada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
    delete:
      tags: [Tarefas]
      summary: Excluir ou cancelar tarefa
      responses:
        '200':
          description: Tarefa cancelada [CONFIRMADO]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
  /tasks/{id}/complete:
    patch:
      tags: [Tarefas]
      summary: Concluir tarefa
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tarefa concluída [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
  /tags:
    get:
      tags: [Tags]
      summary: Listar tags
      responses:
        '200':
          description: Tags visíveis [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
    post:
      tags: [Tags]
      summary: Criar tag
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '201':
          description: Tag criada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
  /tags/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Tags]
      summary: Atualizar tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagPatch'
      responses:
        '200':
          description: Tag atualizada [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
    delete:
      tags: [Tags]
      summary: Excluir tag
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /custom-fields:
    get:
      tags: [Campos personalizados]
      summary: Listar campos personalizados
      parameters:
        - $ref: '#/components/parameters/EntityType'
      responses:
        '200':
          description: Campos disponíveis [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldListResponse'
    post:
      tags: [Campos personalizados]
      summary: Criar campo personalizado
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldInput'
      responses:
        '201':
          description: Campo criado [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldResponse'
  /custom-fields/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Campos personalizados]
      summary: Atualizar campo personalizado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldPatch'
      responses:
        '200':
          description: Campo atualizado [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldResponse'
    delete:
      tags: [Campos personalizados]
      summary: Excluir campo personalizado
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /segments:
    get:
      tags: [Segmentos]
      summary: Listar segmentos salvos
      responses:
        '200':
          description: Segmentos visíveis [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentListResponse'
    post:
      tags: [Segmentos]
      summary: Criar segmento
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentInput'
      responses:
        '201':
          description: Segmento criado [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
  /segments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Segmentos]
      summary: Atualizar segmento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentPatch'
      responses:
        '200':
          description: Segmento atualizado [CONFIRMADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
    delete:
      tags: [Segmentos]
      summary: Excluir segmento
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
components:
  securitySchemes:
    api-key:
      type: http
      scheme: bearer
      bearerFormat: pk_
      description: Chave criada na área de integrações [CONFIRMADO]
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    OwnerFilter:
      name: ownerId
      in: query
      description: UUID do responsável ou `none` para registros sem responsável.
      schema: { type: string }
    TeamFilter:
      name: teamId
      in: query
      description: UUID da equipe ou `none` para registros sem equipe.
      schema: { type: string }
    SectorFilter:
      name: sector
      in: query
      schema: { type: string, maxLength: 100 }
    SizeFilter:
      name: size
      in: query
      schema: { type: string, maxLength: 60 }
    HasContacts:
      name: hasContacts
      in: query
      schema: { type: boolean }
    ConsentFilter:
      name: consent
      in: query
      schema: { type: string, enum: [unknown, granted, revoked] }
    EmailOnly:
      name: emailOnly
      in: query
      deprecated: true
      description: Compatibilidade; prefira `hasEmail=true`.
      schema: { type: boolean }
    TagFilter:
      name: tagId
      in: query
      schema: { type: string, format: uuid }
    CompanyFilter:
      name: company
      in: query
      description: Texto contido no nome da empresa principal.
      schema: { type: string, maxLength: 160 }
    HasPhone:
      name: hasPhone
      in: query
      schema: { type: boolean }
    HasEmail:
      name: hasEmail
      in: query
      schema: { type: boolean }
    From:
      name: from
      in: query
      description: Início inclusivo do período.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Fim exclusivo do período.
      schema: { type: string, format: date-time }
    TaskStatus:
      name: status
      in: query
      schema: { type: string, enum: [OPEN, COMPLETED, CANCELLED, ALL] }
    EntityType:
      name: entityType
      in: query
      schema: { type: string, enum: [company, contact, opportunity] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    Deleted:
      description: Registro excluído [CONFIRMADO]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeletedResponse'
    NotFound:
      description: Registro inexistente ou fora do escopo [CONFIRMADO]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflito de unicidade ou idempotência [CONFIRMADO]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    PageMeta:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        message: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        error: { type: string }
    CustomValues:
      type: object
      additionalProperties: true
    Company:
      type: object
      required: [id, organizationId, name, address, customFields, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        externalId: { type: string, nullable: true }
        cnpj: { type: string, nullable: true, example: '29277764000100' }
        name: { type: string }
        domain: { type: string, nullable: true }
        legalName: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        size: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        linkedinUrl: { type: string, format: uri, nullable: true }
        logoId: { type: string, format: uuid, nullable: true }
        address: { type: object, additionalProperties: true }
        ownerId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        customFields: { $ref: '#/components/schemas/CustomValues' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyInput:
      type: object
      required: [name]
      properties:
        externalId: { type: string }
        cnpj: { type: string }
        name: { type: string }
        domain: { type: string }
        legalName: { type: string }
        sector: { type: string }
        size: { type: string }
        phone: { type: string }
        linkedinUrl: { type: string, format: uri }
        address: { type: object, additionalProperties: true }
        ownerId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        customFields: { $ref: '#/components/schemas/CustomValues' }
    CompanyPatch:
      type: object
      description: Todos os atributos são opcionais; os omitidos permanecem inalterados. [CONFIRMADO]
      properties:
        externalId: { type: string }
        name: { type: string }
        legalName: { type: string }
        cnpj: { type: string }
        domain: { type: string }
        linkedinUrl: { type: string, format: uri, nullable: true }
        sector: { type: string }
        size: { type: string }
        phone: { type: string }
        address: { type: object, additionalProperties: true }
        ownerId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        customFields: { $ref: '#/components/schemas/CustomValues' }
    Contact:
      type: object
      required: [id, organizationId, name, consentStatus, campaignsBlocked, customFields, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        externalId: { type: string, nullable: true }
        name: { type: string }
        jobTitle: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$', nullable: true }
        primaryCompanyId: { type: string, format: uuid, nullable: true }
        ownerId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        source: { type: string, nullable: true }
        consentStatus: { type: string, enum: [UNKNOWN, GRANTED, REVOKED] }
        consentSource: { type: string, nullable: true }
        consentEvidence: { type: string, nullable: true }
        campaignsBlocked: { type: boolean }
        customFields: { $ref: '#/components/schemas/CustomValues' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactInput:
      type: object
      required: [name]
      properties:
        externalId: { type: string }
        name: { type: string }
        jobTitle: { type: string }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        companyId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        source: { type: string }
        consentStatus: { type: string, enum: [unknown, granted, revoked], default: unknown }
        consentSource: { type: string }
        consentEvidence: { type: string }
        campaignsBlocked: { type: boolean, default: false }
        customFields: { $ref: '#/components/schemas/CustomValues' }
    ContactPatch:
      type: object
      description: 'Todos os atributos são opcionais; `companyId: null` remove a empresa principal. [CONFIRMADO]'
      properties:
        externalId: { type: string }
        name: { type: string }
        jobTitle: { type: string }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        companyId: { type: string, format: uuid, nullable: true }
        ownerId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        source: { type: string }
        consentStatus: { type: string, enum: [unknown, granted, revoked] }
        consentSource: { type: string }
        consentEvidence: { type: string }
        campaignsBlocked: { type: boolean }
        customFields: { $ref: '#/components/schemas/CustomValues' }
    Opportunity:
      type: object
      required: [id, organizationId, title, pipelineId, stageId, status, valueCents, currency, probability, customFields, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        externalId: { type: string, nullable: true }
        title: { type: string }
        companyId: { type: string, format: uuid, nullable: true }
        pipelineId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, WON, LOST] }
        valueCents: { type: integer, minimum: 0 }
        currency: { type: string, example: BRL }
        probability: { type: integer, minimum: 0, maximum: 100 }
        expectedCloseAt: { type: string, format: date-time, nullable: true }
        ownerId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        source: { type: string, nullable: true }
        lossReason: { type: string, nullable: true }
        wonAt: { type: string, format: date-time, nullable: true }
        lostAt: { type: string, format: date-time, nullable: true }
        customFields: { $ref: '#/components/schemas/CustomValues' }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OpportunityInput:
      type: object
      required: [title, pipelineId, stageId]
      properties:
        externalId: { type: string }
        title: { type: string }
        companyId: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        valueCents: { type: integer, minimum: 0, default: 0 }
        probability: { type: integer, minimum: 0, maximum: 100 }
        expectedCloseAt: { type: string, format: date-time }
        ownerId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        source: { type: string }
        customFields: { $ref: '#/components/schemas/CustomValues' }
    OpportunityPatch:
      type: object
      description: Todos os atributos são opcionais; etapa deve pertencer ao funil atual ou enviado. [CONFIRMADO]
      properties:
        externalId: { type: string }
        title: { type: string }
