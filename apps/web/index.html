<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171720" />
    <meta name="description" content="Plataforma interna de prospecção, CRM e atendimento por WhatsApp" />
    <link rel="icon" type="image/png" href="/brand-logo.png" />
    <script>
      (() => {
        const saved = localStorage.getItem('prospecta_theme');
        const theme = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>CRM Interno</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
