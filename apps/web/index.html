<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171720" />
    <meta name="description" content="BZS One — plataforma interna integrada da BZS Tecnologia" />
    <link rel="icon" type="image/png" href="/brand-logo.png" />
    <script>
      (() => {
        const saved = localStorage.getItem('prospecta_theme');
        let theme = saved;
        if (theme !== 'dark' && theme !== 'light') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>BZS One</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
