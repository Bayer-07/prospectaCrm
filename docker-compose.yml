name: prospecta

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-http://localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      web:
        condition: service_started
    networks: [edge, app]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: /
    restart: unless-stopped
    expose: ["80"]
    networks: [app]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_ADDRESS:-http://localhost}
      API_INTERNAL_URL: http://api:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospecta}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-prospecta}?schema=public
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
      S3_ENDPOINT: http://minio:9000
      OLLAMA_API_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [app, egress]

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3100
      MCP_API_URL: http://api:3000/api/v1
      MCP_ALLOWED_HOSTS: mcp,localhost,127.0.0.1
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-localhost,127.0.0.1}
    expose: ["3100"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [app]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      APP_URL: ${APP_ADDRESS:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospecta}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-prospecta}?schema=public
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
      S3_ENDPOINT: http://minio:9000
      S3_DELIVERY_ENDPOINT: ${S3_DELIVERY_ENDPOINT_DOCKER:-http://minio.local:9000}
      TRANSCRIPTION_API_URL: http://transcription:8000/v1/audio/transcriptions
      TRANSCRIPTION_API_KEY: ""
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}
      OLLAMA_API_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
    depends_on:
      api: { condition: service_healthy }
      evolution: { condition: service_started }
      transcription: { condition: service_started }
    networks: [app, egress]

  transcription:
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    restart: unless-stopped
    cpu_shares: 256
    environment:
      LOG_LEVEL: warning
      ENABLE_UI: "false"
      PRELOAD_MODELS: '["${TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}"]'
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: ${TRANSCRIPTION_CPU_THREADS:-4}
      WHISPER__NUM_WORKERS: 1
    volumes:
      - transcription_models:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "127.0.0.1:${TRANSCRIPTION_BIND_PORT:-8000}:8000"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 10m
    networks: [app, egress]

  ollama:
    image: ollama/ollama:0.32.5
    profiles: [ai]
    restart: unless-stopped
    cpu_shares: 128
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_BIND_PORT:-11434}:11434"
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [app, egress]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prospecta}
      POSTGRES_USER: ${POSTGRES_USER:-prospecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospecta} -d ${POSTGRES_DB:-prospecta}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-prospecta}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY no .env}
    ports:
      - "${S3_BIND_ADDRESS:-127.0.0.1}:9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      app:
        aliases:
          - minio.local

  evolution-volume-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    # A imagem oficial deriva de node:alpine, cujo usuário node usa UID/GID 1000.
    # O preparo também migra volumes criados por versões antigas executadas como root.
    command: ["sh", "-c", "chown -R 1000:1000 /evolution/instances && chmod 700 /evolution/instances"]
    volumes:
      - evolution_instances:/evolution/instances

  evolution:
    image: ${EVOLUTION_CUSTOM_IMAGE:-bzs-one/evolution-api:2.3.7-link-preview}
    build:
      context: .
      dockerfile: infra/evolution/Dockerfile
      args:
        EVOLUTION_SOURCE_REF: ${EVOLUTION_SOURCE_REF:-cd800f2976e1e5b682fbf86a01ee4d85ae61f370}
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://evolution:8080}
      # A Evolution não é publicada pelo proxy; somente API/worker a acessam com apikey.
      # O wildcard evita que o middleware recuse chamadas servidor-a-servidor sem Origin.
      CORS_ORIGIN: "*"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:?Defina EVOLUTION_POSTGRES_PASSWORD no .env}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: prospecta_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      S3_ENABLED: "true"
      S3_ACCESS_KEY: ${EVOLUTION_S3_ACCESS_KEY:-evolution}
      S3_SECRET_KEY: ${EVOLUTION_S3_SECRET_KEY:?Defina EVOLUTION_S3_SECRET_KEY no .env}
      S3_BUCKET: evolution-media
      S3_PORT: 9000
      S3_ENDPOINT: evolution-minio
      S3_USE_SSL: "false"
      WEBSOCKET_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: BZS One
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      # Evita serialização e escrita de logs por mensagem em produção.
      # INFO/WEBHOOKS pode ser reativado temporariamente pelo .env para diagnóstico.
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR,WARN}
      LOG_BAILEYS: error
      TELEMETRY: "false"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # API e worker executados localmente no modo de desenvolvimento usam esta
      # porta. O bind em loopback mantém a Evolution inacessível pela rede local.
      - "127.0.0.1:${EVOLUTION_BIND_PORT:-8082}:8080"
    expose: ["8080"]
    depends_on:
      evolution-volume-init: { condition: service_completed_successfully }
      evolution-postgres: { condition: service_healthy }
      evolution-redis: { condition: service_healthy }
      evolution-minio: { condition: service_healthy }
    networks: [app, egress]

  evolution-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${EVOLUTION_S3_ACCESS_KEY:-evolution}
      MINIO_ROOT_PASSWORD: ${EVOLUTION_S3_SECRET_KEY:?Defina EVOLUTION_S3_SECRET_KEY no .env}
    volumes:
      - evolution_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  evolution-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?Defina EVOLUTION_POSTGRES_PASSWORD no .env}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution} -d ${EVOLUTION_POSTGRES_DB:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  evolution-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app]

networks:
  edge:
  app:
    internal: true
  egress:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_minio_data:
  transcription_models:
  ollama_models:
